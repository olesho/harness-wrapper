name: ci
on:
  push:
  pull_request:

jobs:
  harness-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install pinned harness
        run: go install github.com/olesho/harness/cmd/harness@$(cat .harness-version)
      - name: Install pinned analyzers
        run: harness install-tools
      - name: harness ci
        run: harness ci
