<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Drift-detection pipeline">
  <style>
    .node { fill: var(--d-node); stroke: var(--d-node-stroke); stroke-width: 1.5; }
    .accent { fill: var(--d-accent-soft); stroke: var(--d-accent); stroke-width: 1.6; }
    .warn { fill: var(--d-lane); stroke: var(--d-warn); stroke-width: 1.5; }
    .tb { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 700; }
    .t { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 11px; }
    .mono { font-family: var(--font-mono, monospace); }
    .ts { fill: var(--d-line); font-family: var(--font-sans, sans-serif); font-size: 10.5px; }
    .line { stroke: var(--d-line); stroke-width: 1.6; fill: none; }
    .okl { stroke: var(--d-ok); stroke-width: 1.6; fill: none; }
    .warnl { stroke: var(--d-warn); stroke-width: 1.6; fill: none; }
    .okt { fill: var(--d-ok); font-family: var(--font-sans, sans-serif); font-size: 10.5px; font-weight: 700; }
    .wnt { fill: var(--d-warn); font-family: var(--font-sans, sans-serif); font-size: 10.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="d-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-line)"/></marker>
    <marker id="d-ok" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-ok)"/></marker>
    <marker id="d-wn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-warn)"/></marker>
  </defs>

  <!-- top row -->
  <rect class="accent" x="30" y="40" width="156" height="60" rx="9"/>
  <text class="tb mono" x="108" y="64" text-anchor="middle">versions.json</text>
  <text class="ts" x="108" y="82" text-anchor="middle">pinned upstream</text>
  <text class="ts" x="108" y="95" text-anchor="middle">per harness</text>

  <rect class="node" x="244" y="40" width="172" height="60" rx="9"/>
  <text class="tb mono" x="330" y="64" text-anchor="middle">make check-versions</text>
  <text class="ts" x="330" y="82" text-anchor="middle">sentry vs registry.npmjs.org</text>
  <text class="ts mono" x="330" y="95" text-anchor="middle">/&lt;pkg&gt;/latest</text>

  <rect class="node" x="474" y="40" width="130" height="60" rx="9"/>
  <text class="tb" x="539" y="68" text-anchor="middle">drift?</text>
  <text class="ts" x="539" y="86" text-anchor="middle">pin vs latest</text>

  <rect class="node" x="650" y="44" width="92" height="52" rx="9"/>
  <text class="okt" x="696" y="66" text-anchor="middle">✓ current</text>
  <text class="ts" x="696" y="82" text-anchor="middle">exit 0</text>

  <path class="line" marker-end="url(#d-arr)" d="M186,70 L242,70"/>
  <path class="line" marker-end="url(#d-arr)" d="M416,70 L472,70"/>
  <path class="okl" marker-end="url(#d-ok)" d="M604,70 L648,70"/>
  <text class="okt" x="626" y="62" text-anchor="middle">match</text>

  <!-- drift -> rebake -->
  <path class="warnl" marker-end="url(#d-wn)" d="M539,100 L545,248"/>
  <text class="wnt" x="556" y="180" text-anchor="start">behind</text>

  <!-- bottom row (right to left) -->
  <rect class="node" x="458" y="250" width="180" height="62" rx="9"/>
  <text class="tb mono" x="548" y="274" text-anchor="middle">make rebake-corpus</text>
  <text class="ts" x="548" y="292" text-anchor="middle">screenbench-record --script</text>
  <text class="ts" x="548" y="305" text-anchor="middle">vs the real binary</text>

  <rect class="node" x="250" y="250" width="168" height="62" rx="9"/>
  <text class="tb" x="334" y="274" text-anchor="middle">adapter tests</text>
  <text class="ts" x="334" y="292" text-anchor="middle">replay fresh corpus</text>
  <text class="ts" x="334" y="305" text-anchor="middle">boundaries + sentinel</text>

  <rect class="accent" x="30" y="250" width="156" height="62" rx="9"/>
  <text class="tb" x="108" y="274" text-anchor="middle">bump pin</text>
  <text class="ts" x="108" y="292" text-anchor="middle">pinned + verified_at</text>
  <text class="ts" x="108" y="305" text-anchor="middle">commit</text>

  <path class="line" marker-end="url(#d-arr)" d="M458,281 L420,281"/>
  <path class="okl" marker-end="url(#d-ok)" d="M250,281 L188,281"/>
  <text class="okt" x="219" y="273" text-anchor="middle">green</text>

  <!-- bump -> versions (close loop) -->
  <path class="line" marker-end="url(#d-arr)" d="M108,250 L108,102"/>
  <text class="ts" x="98" y="180" text-anchor="end">re-verified</text>

  <!-- adapter red -> upgrade-playbook -->
  <rect class="warn" x="300" y="150" width="190" height="58" rx="9"/>
  <text class="tb wnt" x="395" y="174" text-anchor="middle">upgrade-playbook</text>
  <text class="ts" x="395" y="192" text-anchor="middle">diagnose marker drift · tighten regex</text>

  <path class="warnl" marker-end="url(#d-wn)" d="M334,250 C360,234 372,222 388,210"/>
  <text class="wnt" x="356" y="232" text-anchor="middle">red</text>
  <path class="warnl" marker-end="url(#d-wn)" d="M490,196 C530,212 540,228 547,248"/>
  <text class="ts" x="528" y="210" text-anchor="start">re-bake</text>

  <text class="ts" x="30" y="356">Offline, developer-on-demand. check-versions is free (~2s); rebake-corpus spends real API tokens for codex/claude.</text>
  <text class="ts" x="30" y="372">Layer-4 conformance runs the same drift check nightly against installed binaries; a mixed-version corpus is fine — every meta.json records its version.</text>
</svg>
