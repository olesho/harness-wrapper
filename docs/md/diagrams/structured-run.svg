<svg viewBox="0 0 820 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Structured turn protocol: host, workspace boundary, guest runner and the result line">
  <style>
    .node { fill: var(--d-node); stroke: var(--d-node-stroke); stroke-width: 1.4; }
    .accent { fill: var(--d-accent-soft); stroke: var(--d-accent); stroke-width: 1.5; }
    .lane { fill: var(--d-lane); stroke: var(--d-node-stroke); stroke-width: 1; stroke-dasharray: 5 3; }
    .tb { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 12.5px; font-weight: 700; }
    .t { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 11.5px; }
    .ts { fill: var(--d-line); font-family: var(--font-sans, sans-serif); font-size: 10.5px; }
    .lbl { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .mono { font-family: var(--font-mono, monospace); }
    .line { stroke: var(--d-line); stroke-width: 1.5; fill: none; }
    .up { stroke: var(--d-accent); stroke-width: 2; fill: none; }
    .ok { fill: var(--d-ok); font-family: var(--font-mono, monospace); font-size: 11.5px; font-weight: 700; }
    .wn { fill: var(--d-warn); font-family: var(--font-mono, monospace); font-size: 11.5px; font-weight: 700; }
    .er { fill: var(--d-err); font-family: var(--font-mono, monospace); font-size: 11.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="sr-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-line)"/>
    </marker>
    <marker id="sr-up" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-accent)"/>
    </marker>
  </defs>

  <!-- HOST -->
  <rect class="lane" x="16" y="16" width="788" height="104" rx="10"/>
  <text class="lbl" x="28" y="36">HOST — pkg/env.RunStructuredTurn</text>
  <rect class="node" x="28" y="46" width="234" height="58" rx="8"/>
  <text class="tb" x="145" y="70" text-anchor="middle">1 · upload prompt file</text>
  <text class="ts" x="145" y="88" text-anchor="middle">argv can never carry the prompt</text>
  <rect class="node" x="278" y="46" width="234" height="58" rx="8"/>
  <text class="tb" x="395" y="70" text-anchor="middle">2 · exec the runner</text>
  <text class="ts mono" x="395" y="88" text-anchor="middle">structured-run … &lt;harness&gt; --</text>
  <rect class="accent" x="528" y="46" width="272" height="58" rx="8"/>
  <text class="tb" x="664" y="70" text-anchor="middle">3 · ParseLastJSONLine(stdout)</text>
  <text class="ts" x="664" y="88" text-anchor="middle">scans backward — banner noise is fine</text>

  <!-- boundary -->
  <path class="line" marker-end="url(#sr-arr)" d="M395,104 L395,150"/>
  <text class="ts" x="404" y="132">prompt + argv</text>
  <path class="up" marker-end="url(#sr-up)" d="M664,320 L664,246 L700,246 L700,104"/>
  <text class="ts" x="712" y="150">one JSON line</text>

  <!-- GUEST -->
  <rect class="lane" x="16" y="150" width="788" height="170" rx="10"/>
  <text class="lbl" x="28" y="170">GUEST — local dir, container, or remote sandbox (internal/env.Workspace)</text>

  <rect class="accent" x="28" y="182" width="200" height="50" rx="8"/>
  <text class="tb mono" x="128" y="203" text-anchor="middle">structured-run</text>
  <text class="ts" x="128" y="220" text-anchor="middle">cmd/harness-wrapper</text>
  <path class="line" marker-end="url(#sr-arr)" d="M228,207 L262,207"/>
  <rect class="node" x="264" y="182" width="180" height="50" rx="8"/>
  <text class="tb mono" x="354" y="203" text-anchor="middle">pkg/oneshot</text>
  <text class="ts" x="354" y="220" text-anchor="middle">auto-accept policy</text>
  <path class="line" marker-end="url(#sr-arr)" d="M444,207 L478,207"/>
  <rect class="node" x="480" y="182" width="150" height="50" rx="8"/>
  <text class="tb mono" x="555" y="203" text-anchor="middle">pkg/harness</text>
  <text class="ts" x="555" y="220" text-anchor="middle">RunTurn</text>
  <path class="line" marker-end="url(#sr-arr)" d="M630,207 L664,207"/>
  <rect class="node" x="666" y="182" width="134" height="50" rx="8"/>
  <text class="tb mono" x="733" y="203" text-anchor="middle">pkg/chat</text>
  <text class="ts" x="733" y="220" text-anchor="middle">one turn</text>

  <rect class="node" x="28" y="248" width="772" height="56" rx="8"/>
  <text class="tb" x="414" y="270" text-anchor="middle">harness process under a PTY — one turn, then a graceful quit</text>
  <text class="ts" x="414" y="290" text-anchor="middle">transcript read back from the harness's own JSONL · usage totalled · session id captured</text>

  <!-- exit codes -->
  <rect class="lane" x="16" y="334" width="788" height="102" rx="10"/>
  <text class="lbl" x="28" y="354">RESULT — status, exit code, and the stderr anchor</text>
  <rect class="node" x="28" y="364" width="184" height="58" rx="8"/>
  <text class="ok" x="120" y="386" text-anchor="middle">completed → 0</text>
  <text class="ts" x="120" y="404" text-anchor="middle">reply populated</text>
  <rect class="node" x="224" y="364" width="184" height="58" rx="8"/>
  <text class="wn" x="316" y="386" text-anchor="middle">deadline → 124</text>
  <text class="ts" x="316" y="404" text-anchor="middle">+ DeadlineLine on stderr</text>
  <rect class="node" x="420" y="364" width="184" height="58" rx="8"/>
  <text class="er" x="512" y="386" text-anchor="middle">errored → 1</text>
  <text class="ts" x="512" y="404" text-anchor="middle">reached the harness</text>
  <rect class="node" x="616" y="364" width="184" height="58" rx="8"/>
  <text class="er" x="708" y="386" text-anchor="middle">startup_error → 1</text>
  <text class="ts" x="708" y="404" text-anchor="middle">no harness ever launched</text>
</svg>
