<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How a turn is gated before sending and which route completes it">
  <style>
    .node { fill: var(--d-node); stroke: var(--d-node-stroke); stroke-width: 1.4; }
    .accent { fill: var(--d-accent-soft); stroke: var(--d-accent); stroke-width: 1.5; }
    .lane { fill: var(--d-lane); stroke: var(--d-node-stroke); stroke-width: 1; stroke-dasharray: 5 3; }
    .tb { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 12.5px; font-weight: 700; }
    .t { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 11.5px; }
    .ts { fill: var(--d-line); font-family: var(--font-sans, sans-serif); font-size: 10.5px; }
    .lbl { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .mono { font-family: var(--font-mono, monospace); }
    .line { stroke: var(--d-line); stroke-width: 1.5; fill: none; }
    .ok { fill: var(--d-ok); font-family: var(--font-sans, sans-serif); font-size: 11.5px; font-weight: 700; }
    .er { fill: var(--d-err); font-family: var(--font-sans, sans-serif); font-size: 11.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="c-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-line)"/>
    </marker>
  </defs>

  <!-- gate row -->
  <text class="lbl" x="20" y="26">BEFORE THE PROMPT IS WRITTEN</text>
  <rect class="node" x="20" y="36" width="236" height="62" rx="8"/>
  <text class="tb" x="138" y="58" text-anchor="middle">control token + no turn in flight</text>
  <text class="ts" x="138" y="76" text-anchor="middle">otherwise ErrNoControl / ErrTurnInFlight</text>
  <text class="ts" x="138" y="90" text-anchor="middle">a pending prompt gives ErrInputPending</text>
  <path class="line" marker-end="url(#c-arr)" d="M256,67 L286,67"/>
  <rect class="node" x="288" y="36" width="236" height="62" rx="8"/>
  <text class="tb" x="406" y="58" text-anchor="middle">wait for a ready composer</text>
  <text class="ts" x="406" y="76" text-anchor="middle">per-harness readiness marker; a login</text>
  <text class="ts" x="406" y="90" text-anchor="middle">wall short-circuits as auth required</text>
  <path class="line" marker-end="url(#c-arr)" d="M524,67 L554,67"/>
  <rect class="accent" x="556" y="36" width="244" height="62" rx="8"/>
  <text class="tb" x="678" y="58" text-anchor="middle">one write: text + submit key</text>
  <text class="ts" x="678" y="76" text-anchor="middle">no per-character typing, no retry</text>
  <text class="ts mono" x="678" y="90" text-anchor="middle">CSI 13u · CR · LF — per harness</text>

  <!-- routes -->
  <rect class="lane" x="20" y="112" width="780" height="234" rx="10"/>
  <text class="lbl" x="32" y="132">THREE ROUTES OUT OF A PENDING TURN</text>

  <!-- route A -->
  <rect class="node" x="32" y="142" width="228" height="58" rx="8"/>
  <text class="tb" x="146" y="164" text-anchor="middle">A · end-of-turn marker</text>
  <text class="ts" x="146" y="182" text-anchor="middle">adapter recognises the harness's own</text>
  <text class="ts" x="146" y="194" text-anchor="middle">completion line on the screen</text>
  <path class="line" marker-end="url(#c-arr)" d="M260,171 L286,171"/>
  <rect class="node" x="288" y="142" width="228" height="58" rx="8"/>
  <text class="tb" x="402" y="164" text-anchor="middle">short confirm window</text>
  <text class="ts" x="402" y="182" text-anchor="middle">a marker arms it; a repaint restarts it</text>
  <text class="ts" x="402" y="194" text-anchor="middle">so a mid-stream flicker cannot finish</text>
  <path class="line" marker-end="url(#c-arr)" d="M516,171 L542,171"/>
  <rect class="node" x="544" y="142" width="240" height="58" rx="8"/>
  <text class="ok" x="664" y="167" text-anchor="middle">complete</text>
  <text class="ts" x="664" y="188" text-anchor="middle">reply text extracted from the screen</text>

  <!-- route B -->
  <rect class="node" x="32" y="212" width="228" height="58" rx="8"/>
  <text class="tb" x="146" y="234" text-anchor="middle">B · no marker exists</text>
  <text class="ts" x="146" y="252" text-anchor="middle">the harness has no completion line</text>
  <text class="ts" x="146" y="264" text-anchor="middle">we can key on yet</text>
  <path class="line" marker-end="url(#c-arr)" d="M260,241 L286,241"/>
  <rect class="node" x="288" y="212" width="228" height="58" rx="8"/>
  <text class="tb" x="402" y="234" text-anchor="middle">longer idle window</text>
  <text class="ts" x="402" y="252" text-anchor="middle">composer ready, spinner absent,</text>
  <text class="ts" x="402" y="264" text-anchor="middle">screen quiet for the whole window</text>
  <path class="line" marker-end="url(#c-arr)" d="M516,241 L542,241"/>
  <rect class="node" x="544" y="212" width="240" height="58" rx="8"/>
  <text class="ok" x="664" y="237" text-anchor="middle">complete</text>
  <text class="ts" x="664" y="258" text-anchor="middle">lower fidelity — no intermediate work</text>

  <!-- route C -->
  <rect class="node" x="32" y="282" width="228" height="52" rx="8"/>
  <text class="tb" x="146" y="304" text-anchor="middle">C · the wrapper speaks</text>
  <text class="ts" x="146" y="322" text-anchor="middle">exit, signal, cost, quota, API error</text>
  <path class="line" marker-end="url(#c-arr)" d="M260,308 L286,308"/>
  <rect class="node" x="288" y="282" width="228" height="52" rx="8"/>
  <text class="tb" x="402" y="304" text-anchor="middle">status → turn event</text>
  <text class="ts" x="402" y="322" text-anchor="middle">carries HTTP code and retry hint</text>
  <path class="line" marker-end="url(#c-arr)" d="M516,308 L542,308"/>
  <rect class="node" x="544" y="282" width="240" height="52" rx="8"/>
  <text class="er" x="664" y="307" text-anchor="middle">errored / blocked</text>
  <text class="ts" x="664" y="325" text-anchor="middle">auth and usage limits get a stable reason</text>

  <text class="ts" x="20" y="372">Waiting-for-input from the wrapper also completes a turn — that is the fallback every adapter inherits.</text>
  <text class="ts" x="20" y="390">Events are dropped, never blocked, when a consumer is too slow: drain the channel or size its buffer for your workload.</text>
  <text class="ts" x="20" y="408">Exact windows and their overrides are listed in the Chat API reference; they are tuned per harness, not part of the wire contract.</text>
</svg>
