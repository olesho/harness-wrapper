<svg viewBox="0 0 780 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Normalized status classification">
  <style>
    .node { fill: var(--d-node); stroke: var(--d-node-stroke); stroke-width: 1.5; }
    .accent { fill: var(--d-accent-soft); stroke: var(--d-accent); stroke-width: 1.6; }
    .lane { fill: var(--d-lane); stroke: var(--d-node-stroke); stroke-width: 1; stroke-dasharray: 5 3; }
    .term { fill: var(--d-node); stroke: var(--d-node-stroke); stroke-width: 1.5; }
    .tb { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 700; }
    .t { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 12px; }
    .mono { font-family: var(--font-mono, monospace); }
    .ts { fill: var(--d-line); font-family: var(--font-sans, sans-serif); font-size: 10.5px; }
    .line { stroke: var(--d-line); stroke-width: 1.5; fill: none; }
    .warn { stroke: var(--d-warn); stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .ok { fill: var(--d-ok); }
    .wn { fill: var(--d-warn); }
    .er { fill: var(--d-err); }
  </style>
  <defs>
    <marker id="s-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-line)"/>
    </marker>
    <marker id="s-warn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-warn)"/>
    </marker>
  </defs>

  <!-- start + binary gate -->
  <rect class="node" x="24" y="40" width="96" height="40" rx="9"/>
  <text class="tb" x="72" y="65" text-anchor="middle">Start</text>
  <path class="line" marker-end="url(#s-arr)" d="M120,60 L168,60"/>
  <rect class="node" x="170" y="38" width="150" height="44" rx="9"/>
  <text class="t" x="245" y="56" text-anchor="middle">binary on PATH?</text>
  <text class="ts" x="245" y="72" text-anchor="middle">pre-start check</text>
  <path class="line" marker-end="url(#s-arr)" d="M320,52 L470,52"/>
  <text class="ts" x="395" y="44" text-anchor="middle">missing</text>
  <rect class="term" x="472" y="34" width="170" height="40" rx="9"/>
  <text class="t mono er" x="557" y="59" text-anchor="middle">binary_not_found</text>

  <!-- running -->
  <path class="line" marker-end="url(#s-arr)" d="M245,82 L245,118"/>
  <text class="ts" x="262" y="104" text-anchor="start">started</text>
  <rect class="accent" x="150" y="120" width="190" height="56" rx="10"/>
  <text class="tb" x="245" y="143" text-anchor="middle">harness running</text>
  <text class="ts" x="245" y="161" text-anchor="middle">supervised under PTY · output streaming</text>

  <!-- non-terminal advisories band (right) -->
  <rect class="lane" x="470" y="104" width="286" height="150" rx="10"/>
  <text class="ts" x="613" y="124" text-anchor="middle">non-terminal advisories — harness keeps running</text>
  <rect class="node" x="486" y="134" width="166" height="34" rx="8"/>
  <text class="t mono wn" x="569" y="156" text-anchor="middle">waiting_for_input</text>
  <rect class="node" x="486" y="174" width="166" height="34" rx="8"/>
  <text class="t mono" x="569" y="196" text-anchor="middle">api_error</text>
  <rect class="node" x="486" y="214" width="166" height="34" rx="8"/>
  <text class="t mono" x="569" y="236" text-anchor="middle">stale</text>
  <text class="ts" x="724" y="156" text-anchor="end">prompt</text>
  <text class="ts" x="724" y="196" text-anchor="end">HTTP code</text>
  <text class="ts" x="724" y="236" text-anchor="end">5m quiet</text>
  <path class="warn" marker-end="url(#s-warn)" d="M340,150 C410,150 430,150 484,151"/>
  <path class="warn" marker-end="url(#s-warn)" d="M340,160 C400,180 430,190 484,191"/>
  <path class="warn" marker-end="url(#s-warn)" d="M300,176 C320,230 420,231 484,231"/>

  <!-- idle-detection gate -->
  <path class="line" marker-end="url(#s-arr)" d="M245,176 L245,212"/>
  <text class="ts" x="262" y="198" text-anchor="start">quiet ≥ 15s, then ≥ 60s</text>
  <rect class="accent" x="150" y="214" width="190" height="50" rx="10"/>
  <text class="tb" x="245" y="235" text-anchor="middle">classify latest screen</text>
  <text class="ts" x="245" y="252" text-anchor="middle">+ exit code / signal</text>

  <!-- terminal outcomes (bottom grid) -->
  <g>
    <rect class="term" x="40" y="330" width="150" height="46" rx="9"/>
    <text class="t mono ok" x="115" y="352" text-anchor="middle">idle</text>
    <text class="ts" x="115" y="368" text-anchor="middle">no actionable state</text>

    <rect class="term" x="210" y="330" width="160" height="46" rx="9"/>
    <text class="t mono wn" x="290" y="352" text-anchor="middle">blocked_by_cost</text>
    <text class="ts" x="290" y="368" text-anchor="middle">budget / quota</text>

    <rect class="term" x="390" y="330" width="150" height="46" rx="9"/>
    <text class="t mono wn" x="465" y="352" text-anchor="middle">retry_later</text>
    <text class="ts" x="465" y="368" text-anchor="middle">transient error</text>

    <rect class="term" x="560" y="330" width="150" height="46" rx="9"/>
    <text class="t mono er" x="635" y="352" text-anchor="middle">failed</text>
    <text class="ts" x="635" y="368" text-anchor="middle">non-zero exit</text>

    <rect class="term" x="140" y="392" width="160" height="46" rx="9"/>
    <text class="t mono" x="220" y="414" text-anchor="middle">interrupted</text>
    <text class="ts" x="220" y="430" text-anchor="middle">signal / ctx cancel</text>

    <rect class="term" x="320" y="392" width="150" height="46" rx="9"/>
    <text class="t mono" x="395" y="414" text-anchor="middle">unknown</text>
    <text class="ts" x="395" y="430" text-anchor="middle">unclassifiable</text>
  </g>

  <!-- gate -> terminal fan-out -->
  <path class="line" marker-end="url(#s-arr)" d="M180,264 C140,290 120,300 115,328"/>
  <path class="line" marker-end="url(#s-arr)" d="M240,264 C260,295 285,300 290,328"/>
  <path class="line" marker-end="url(#s-arr)" d="M270,264 C360,295 450,300 465,328"/>
  <path class="line" marker-end="url(#s-arr)" d="M300,260 C470,290 600,300 635,328"/>
  <path class="line" marker-end="url(#s-arr)" d="M210,264 C200,330 215,360 220,390"/>
  <path class="line" marker-end="url(#s-arr)" d="M260,264 C320,330 380,360 395,390"/>

  <!-- ClassifyOutput note -->
  <rect class="lane" x="540" y="392" width="216" height="58" rx="9"/>
  <text class="ts mono" x="648" y="414" text-anchor="middle">ClassifyOutput()</text>
  <text class="ts" x="648" y="431" text-anchor="middle">upgrades a bare failed exit into</text>
  <text class="ts" x="648" y="445" text-anchor="middle">blocked_by_cost / retry_later</text>
  <path class="warn" marker-end="url(#s-warn)" d="M635,376 L648,390"/>

  <!-- legend -->
  <text class="ts" x="40" y="486">Terminal statuses end the run (wrapper SIGTERMs the harness). Advisories are emitted mid-run while it keeps going.</text>
  <text class="ts" x="40" y="504">waiting_for_input pauses for an answer; once answered the harness resumes. Thresholds are per-harness (Config.IdleQuiet / IdleClassify / StaleThreshold).</text>
</svg>
