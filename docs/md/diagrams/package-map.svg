  <rect class="node" x="224" y="556" width="184" height="48" rx="8"/>
  <text class="tb mono" x="316" y="578" text-anchor="middle">internal/screenbench</text>
  <text class="ts" x="316" y="594" text-anchor="middle">emulator bake-off + recorder</text>
  <rect class="node" x="420" y="556" width="184" height="48" rx="8"/>
  <text class="tb mono" x="512" y="578" text-anchor="middle">test/corpus</text>
  <text class="ts" x="512" y="594" text-anchor="middle">recorded bytes · frozen wire</text>
  <rect class="node" x="616" y="556" width="184" height="48" rx="8"/>
  <text class="tb mono" x="708" y="578" text-anchor="middle">clients/ · docs/gen</text>
