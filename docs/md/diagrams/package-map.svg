  <rect class="accent" x="28" y="352" width="380" height="48" rx="8"/>
  <text class="tb mono" x="218" y="374" text-anchor="middle">pkg/wrapper</text>
  <text class="ts" x="218" y="390" text-anchor="middle">PTY supervisor · Status classifier · permission argv</text>
  <rect class="node" x="420" y="352" width="184" height="48" rx="8"/>
  <text class="tb mono" x="512" y="374" text-anchor="middle">pkg/wrapper/trace</text>
  <text class="ts" x="512" y="390" text-anchor="middle">diagnostic events</text>
  <rect class="node" x="616" y="352" width="184" height="48" rx="8"/>
  <text class="tb" x="708" y="374" text-anchor="middle">harness process</text>
  <text class="ts" x="708" y="390" text-anchor="middle">under a real PTY</text>

