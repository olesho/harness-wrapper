<svg viewBox="0 0 820 646" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="harness-wrapper package map">
  <style>
    .node { fill: var(--d-node); stroke: var(--d-node-stroke); stroke-width: 1.4; }
    .accent { fill: var(--d-accent-soft); stroke: var(--d-accent); stroke-width: 1.5; }
    .lane { fill: var(--d-lane); stroke: var(--d-node-stroke); stroke-width: 1; stroke-dasharray: 5 3; }
    .tb { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 12.5px; font-weight: 700; }
    .ts { fill: var(--d-line); font-family: var(--font-sans, sans-serif); font-size: 10.5px; }
    .lbl { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .mono { font-family: var(--font-mono, monospace); }
  </style>

  <!-- Lane 1: entry points -->
  <rect class="lane" x="16" y="16" width="788" height="90" rx="10"/>
  <text class="lbl" x="28" y="36">ENTRY POINTS — binaries you run</text>
  <rect class="accent" x="28" y="46" width="184" height="48" rx="8"/>
  <text class="tb mono" x="120" y="68" text-anchor="middle">cmd/harness-wrapper</text>
  <text class="ts" x="120" y="84" text-anchor="middle">CLI: passthrough · run · tmux</text>
  <rect class="accent" x="224" y="46" width="184" height="48" rx="8"/>
  <text class="tb mono" x="316" y="68" text-anchor="middle">cmd/harness-chatd</text>
  <text class="ts" x="316" y="84" text-anchor="middle">HTTP + SSE gateway</text>
  <rect class="node" x="420" y="46" width="184" height="48" rx="8"/>
  <text class="tb mono" x="512" y="68" text-anchor="middle">cmd/check-versions</text>
  <text class="ts" x="512" y="84" text-anchor="middle">npm drift sentry</text>
  <rect class="node" x="616" y="46" width="184" height="48" rx="8"/>
  <text class="tb mono" x="708" y="68" text-anchor="middle">cmd/fakeharness</text>
  <text class="ts" x="708" y="84" text-anchor="middle">scriptable test harness</text>

  <!-- Lane 2: session + orchestration -->
  <rect class="lane" x="16" y="118" width="788" height="90" rx="10"/>
  <text class="lbl" x="28" y="138">SESSION &amp; ORCHESTRATION</text>
  <rect class="accent" x="28" y="148" width="184" height="48" rx="8"/>
  <text class="tb mono" x="120" y="170" text-anchor="middle">pkg/chat</text>
  <text class="ts" x="120" y="186" text-anchor="middle">Conversation · turns · events</text>
  <rect class="node" x="224" y="148" width="184" height="48" rx="8"/>
  <text class="tb mono" x="316" y="170" text-anchor="middle">pkg/chat/memstore</text>
  <text class="ts" x="316" y="186" text-anchor="middle">in-memory Store</text>
  <rect class="node" x="420" y="148" width="184" height="48" rx="8"/>
  <text class="tb mono" x="512" y="170" text-anchor="middle">pkg/harness</text>
  <text class="ts" x="512" y="186" text-anchor="middle">profiles · hooks · RunTurn</text>
  <rect class="node" x="616" y="148" width="184" height="48" rx="8"/>
  <text class="tb mono" x="708" y="170" text-anchor="middle">pkg/oneshot</text>
  <text class="ts" x="708" y="186" text-anchor="middle">one typed turn, headless</text>

