  <rect class="lane" x="16" y="424" width="788" height="90" rx="10"/>
  <text class="lbl" x="28" y="444">CONTRACTS &amp; SUPPORT</text>
  <rect class="node" x="28" y="454" width="184" height="48" rx="8"/>
  <text class="tb mono" x="120" y="476" text-anchor="middle">pkg/turnproto</text>
  <text class="ts" x="120" y="492" text-anchor="middle">structured-turn wire format</text>
  <rect class="node" x="224" y="454" width="184" height="48" rx="8"/>
  <text class="tb mono" x="316" y="476" text-anchor="middle">pkg/versions</text>
  <text class="ts" x="316" y="492" text-anchor="middle">pinned upstream releases</text>
  <rect class="node" x="420" y="454" width="184" height="48" rx="8"/>
  <text class="tb mono" x="512" y="476" text-anchor="middle">pkg/discovery</text>
  <text class="ts" x="512" y="492" text-anchor="middle">installed? version? models</text>
  <rect class="node" x="616" y="454" width="184" height="48" rx="8"/>
  <text class="tb mono" x="708" y="476" text-anchor="middle">pkg/env · internal/env</text>
  <text class="ts" x="708" y="492" text-anchor="middle">workspaces &amp; containment</text>

