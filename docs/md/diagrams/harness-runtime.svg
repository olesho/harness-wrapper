<svg viewBox="0 0 800 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pkg/harness: two entry points, profile capabilities, and transcript acquisition strategies">
  <style>
    .node { fill: var(--d-node); stroke: var(--d-node-stroke); stroke-width: 1.4; }
    .accent { fill: var(--d-accent-soft); stroke: var(--d-accent); stroke-width: 1.5; }
    .lane { fill: var(--d-lane); stroke: var(--d-node-stroke); stroke-width: 1; stroke-dasharray: 5 3; }
    .tb { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 12.5px; font-weight: 700; }
    .t { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 11.5px; }
    .ts { fill: var(--d-line); font-family: var(--font-sans, sans-serif); font-size: 10.5px; }
    .lbl { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .mono { font-family: var(--font-mono, monospace); }
    .line { stroke: var(--d-line); stroke-width: 1.5; fill: none; }
    .ok { fill: var(--d-ok); font-family: var(--font-sans, sans-serif); font-size: 10.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="h-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-line)"/>
    </marker>
  </defs>

  <!-- entry points -->
  <text class="lbl" x="20" y="26">TWO INDEPENDENT ENTRY POINTS</text>
  <rect class="accent" x="20" y="36" width="374" height="62" rx="9"/>
  <text class="tb mono" x="207" y="59" text-anchor="middle">harness.Run</text>
  <text class="ts" x="207" y="77" text-anchor="middle">headless supervision — wrapper.Start + line tap</text>
  <text class="ts" x="207" y="91" text-anchor="middle">emits transcript events while the harness works</text>

  <rect class="accent" x="406" y="36" width="374" height="62" rx="9"/>
  <text class="tb mono" x="593" y="59" text-anchor="middle">harness.RunTurn</text>
  <text class="ts" x="593" y="77" text-anchor="middle">exactly one interactive turn — opens a chat.Conversation</text>
  <text class="ts" x="593" y="91" text-anchor="middle">graceful quit, then a transcript-backed reply</text>

  <!-- profile -->
  <rect class="lane" x="20" y="112" width="760" height="112" rx="10"/>
  <text class="lbl" x="32" y="132">PROFILE REGISTRY — capabilities confirmed per run, not assumed</text>
  <rect class="node" x="32" y="142" width="190" height="66" rx="8"/>
  <text class="tb mono" x="127" y="166" text-anchor="middle">Profile.Resolve(ctx)</text>
  <text class="ts" x="127" y="184" text-anchor="middle">binary, argv, env, cwd</text>
  <text class="ts" x="127" y="198" text-anchor="middle">config roots probed read-only</text>
  <path class="line" marker-end="url(#h-arr)" d="M222,175 L252,175"/>
  <rect class="node" x="254" y="142" width="126" height="66" rx="8"/>
  <text class="tb mono" x="317" y="168" text-anchor="middle">SessionID</text>
  <text class="ts" x="317" y="188" text-anchor="middle">scrape the id</text>
  <rect class="node" x="390" y="142" width="126" height="66" rx="8"/>
  <text class="tb mono" x="453" y="168" text-anchor="middle">Resume</text>
  <text class="ts" x="453" y="188" text-anchor="middle">argv to resume</text>
  <rect class="node" x="526" y="142" width="126" height="66" rx="8"/>
  <text class="tb mono" x="589" y="168" text-anchor="middle">Stream</text>
  <text class="ts" x="589" y="188" text-anchor="middle">parse stdout</text>
  <rect class="node" x="662" y="142" width="106" height="66" rx="8"/>
  <text class="tb mono" x="715" y="168" text-anchor="middle">Hooks</text>
  <text class="ts" x="715" y="188" text-anchor="middle">spool events</text>

  <!-- acquisition -->
  <rect class="lane" x="20" y="238" width="760" height="122" rx="10"/>
  <text class="lbl" x="32" y="258">TRANSCRIPT ACQUISITION — chosen once, per run</text>
  <rect class="node" x="32" y="268" width="176" height="76" rx="8"/>
  <text class="tb" x="120" y="292" text-anchor="middle">hooks</text>
  <text class="ts" x="120" y="310" text-anchor="middle">harness writes settings.json</text>
  <text class="ts" x="120" y="324" text-anchor="middle">hook subprocesses spool JSON</text>
  <text class="ok" x="120" y="338" text-anchor="middle">richest — subagents included</text>
  <rect class="node" x="220" y="268" width="176" height="76" rx="8"/>
  <text class="tb" x="308" y="292" text-anchor="middle">stream</text>
  <text class="ts" x="308" y="310" text-anchor="middle">parse the harness's own</text>
  <text class="ts" x="308" y="324" text-anchor="middle">JSON lines as they print</text>
  <text class="ts" x="308" y="338" text-anchor="middle">live, no config written</text>
  <rect class="node" x="408" y="268" width="176" height="76" rx="8"/>
  <text class="tb" x="496" y="292" text-anchor="middle">none</text>
  <text class="ts" x="496" y="310" text-anchor="middle">no sink, or no capability</text>
  <text class="ts" x="496" y="324" text-anchor="middle">supervision still works</text>
  <rect class="node" x="596" y="268" width="172" height="76" rx="8"/>
  <text class="tb" x="682" y="292" text-anchor="middle">auto</text>
  <text class="ts" x="682" y="310" text-anchor="middle">hooks when available,</text>
  <text class="ts" x="682" y="324" text-anchor="middle">else stream, else none —</text>
  <text class="ts" x="682" y="338" text-anchor="middle">with a stream shadow buffer</text>

  <!-- envelope -->
  <rect class="lane" x="20" y="374" width="760" height="62" rx="10"/>
  <text class="lbl" x="32" y="394">EVERY EVENT LEAVES AS ONE ENVELOPE</text>
  <text class="ts mono" x="32" y="414">Seq · SchemaVersion · Source (live | file) · NativeID · RunID · HarnessSessionID</text>
  <text class="ts" x="32" y="429">a central authority filter decides which copy of a duplicated event is admitted; subagent events always are</text>
</svg>
