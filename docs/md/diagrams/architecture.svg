<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="harness-wrapper layered architecture">
  <style>
    .node { fill: var(--d-node); stroke: var(--d-node-stroke); stroke-width: 1.5; }
    .accent { fill: var(--d-accent-soft); stroke: var(--d-accent); stroke-width: 1.5; }
    .lane { fill: var(--d-lane); stroke: var(--d-node-stroke); stroke-width: 1; stroke-dasharray: 4 3; }
    .t { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 13px; }
    .tb { fill: var(--d-node-text); font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 700; }
    .ts { fill: var(--d-line); font-family: var(--font-sans, sans-serif); font-size: 11px; }
    .mono { font-family: var(--font-mono, monospace); }
    .line { stroke: var(--d-line); stroke-width: 1.6; fill: none; }
    .up { stroke: var(--d-accent); stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a-arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-line)"/>
    </marker>
    <marker id="a-up" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="var(--d-accent)"/>
    </marker>
  </defs>

  <!-- Transports (top) -->
  <text class="ts" x="40" y="44" text-anchor="start">transports — import pkg/chat</text>
  <rect class="accent" x="190" y="52" width="180" height="54" rx="9"/>
  <text class="tb mono" x="280" y="76" text-anchor="middle">cmd/harness-chatd</text>
  <text class="ts" x="280" y="94" text-anchor="middle">HTTP + SSE gateway</text>

  <rect class="accent" x="384" y="52" width="180" height="54" rx="9"/>
  <text class="tb mono" x="474" y="76" text-anchor="middle">cmd/harness-wrapper</text>
  <text class="ts" x="474" y="94" text-anchor="middle">CLI front-end</text>

  <!-- Layer 4: chat -->
  <rect class="accent" x="190" y="130" width="374" height="56" rx="9"/>
  <text class="tb mono" x="377" y="153" text-anchor="middle">pkg/chat</text>
  <text class="ts" x="377" y="172" text-anchor="middle">Conversation · control · turns · events · history</text>

  <!-- Layer 3: turns + transcript -->
  <rect class="node" x="190" y="206" width="240" height="56" rx="9"/>
  <text class="tb mono" x="310" y="229" text-anchor="middle">pkg/turns</text>
  <text class="ts" x="310" y="248" text-anchor="middle">per-harness adapters + watcher</text>

  <rect class="node" x="442" y="206" width="122" height="56" rx="9"/>
  <text class="tb mono" x="503" y="229" text-anchor="middle">pkg/transcript</text>
  <text class="ts" x="503" y="248" text-anchor="middle">JSONL readers</text>

  <!-- Layer 2: screen -->
  <rect class="node" x="190" y="282" width="374" height="50" rx="9"/>
  <text class="tb mono" x="377" y="303" text-anchor="middle">pkg/screen</text>
  <text class="ts" x="377" y="320" text-anchor="middle">vt100 emulator (vt10x) — queryable terminal state</text>

  <!-- Layer 1: wrapper -->
  <rect class="node" x="190" y="352" width="374" height="56" rx="9"/>
  <text class="tb mono" x="377" y="375" text-anchor="middle">pkg/wrapper</text>
  <text class="ts" x="377" y="394" text-anchor="middle">PTY supervisor + status classifier</text>

  <!-- Harness process under PTY -->
  <rect class="accent" x="190" y="430" width="374" height="48" rx="9"/>
  <text class="tb" x="377" y="453" text-anchor="middle">harness process</text>
  <text class="ts" x="377" y="470" text-anchor="middle">claude · codex · gemini · opencode · pi — under a creack/pty PTY</text>

  <!-- Support lane (right) -->
  <rect class="lane" x="600" y="206" width="144" height="202" rx="10"/>
  <text class="ts" x="672" y="230" text-anchor="middle">support</text>
  <rect class="node" x="616" y="246" width="112" height="56" rx="9"/>
  <text class="tb mono" x="672" y="269" text-anchor="middle">pkg/versions</text>
  <text class="ts" x="672" y="288" text-anchor="middle">pinned upstream</text>
  <rect class="node" x="616" y="320" width="112" height="56" rx="9"/>
  <text class="tb mono" x="672" y="343" text-anchor="middle">pkg/discovery</text>
  <text class="ts" x="672" y="362" text-anchor="middle">installed? version?</text>

  <!-- Dependency arrows (transports -> chat) -->
  <path class="line" marker-end="url(#a-arr)" d="M280,106 L300,128"/>
  <path class="line" marker-end="url(#a-arr)" d="M474,106 L454,128"/>

  <!-- Upward data flow spine (PTY bytes climb the stack) -->
  <path class="up" marker-end="url(#a-up)" d="M150,454 L150,168 L186,168"/>
  <path class="up" marker-end="url(#a-up)" d="M150,380 L186,380"/>
  <path class="up" marker-end="url(#a-up)" d="M150,307 L186,307"/>
  <path class="up" marker-end="url(#a-up)" d="M150,234 L186,234"/>
  <text class="ts" x="142" y="300" text-anchor="end" transform="rotate(-90 142 300)">PTY bytes → screen → turn events → chat</text>

  <!-- transcript feeds history -->
  <path class="line" marker-end="url(#a-arr)" d="M503,206 L460,188"/>
</svg>
