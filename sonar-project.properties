# SonarQube scan config for this project. Seeded once by harness; yours to edit.
# sonar.projectKey must be unique across the shared SonarQube instance.
# Scans run against the self-hosted server (default http://localhost:9000) using
# SONAR_TOKEN — a LOCAL API credential; nothing is sent off this machine.
sonar.projectKey=harness-wrapper
sonar.projectName=harness-wrapper
sonar.sources=.
# docs/ is harness-generated (harness docs markdown); modules.html embeds one SVG
# per module, all sharing id="arrow" -> spurious duplicate-id "bugs". Not source.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/vendor/**,docs/**
sonar.sourceEncoding=UTF-8
# Go coverage profile (produced into coverage.out before the scan; see COVERPROFILE).
sonar.go.coverage.reportPaths=coverage.out
